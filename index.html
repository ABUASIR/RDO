<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#090b0f">

<title>🎯 التحديات اليومية ريد ديد اونلاين</title>

<script>
if (location.protocol !== "https:" && location.hostname !== "localhost") {
    location.href =
        "https://" +
        location.host +
        location.pathname +
        location.search +
        location.hash;
}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================
   المتغيرات العامة
========================================= */

:root{
    --bg:#090b0f;
    --bg-soft:#0f1218;

    --card:rgba(20,23,30,.92);
    --card-2:rgba(16,19,25,.96);

    --text:#f3f6fb;
    --text-soft:#d6dbe4;

    --muted:#98a2b3;

    --accent:#16d9f5;
    --accent-2:#0cb8d0;

    --accent-soft:rgba(22,217,245,.10);

    --line:rgba(255,255,255,.08);

    --success:#42d392;
    --warning:#ffb020;
    --danger:#ff4567;

    --radius:24px;

    --shadow:
        0 18px 50px rgba(0,0,0,.35);

    --shadow-soft:
        0 10px 30px rgba(0,0,0,.25);
}


/* =========================================
   منع النسخ والتحديد
========================================= */

*{
    box-sizing:border-box;

    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
    user-select:none;

    -webkit-user-drag:none;
}

::selection{
    background:transparent;
}

::-moz-selection{
    background:transparent;
}


/* =========================================
   الصفحة
========================================= */

html{
    scroll-behavior:smooth;
}

body{
    margin:0;

    min-height:100vh;

    background:
        radial-gradient(
            900px 600px at 80% -5%,
            rgba(22,217,245,.13),
            transparent 55%
        ),
        radial-gradient(
            700px 500px at 5% 20%,
            rgba(79,70,229,.07),
            transparent 55%
        ),
        linear-gradient(
            180deg,
            #0b0d11,
            #08090c
        );

    background-attachment:fixed;

    color:var(--text);

    font-family:"Tajawal",sans-serif;

    line-height:1.8;

    padding:
        0
        14px
        calc(55px + env(safe-area-inset-bottom));
}


/* =========================================
   Canvas الفقاعات
========================================= */

#bubbleCanvas{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    z-index:0;

    display:block;

    /*
       مهم:
       يسمح بالضغط على الموقع بشكل طبيعي.
       الضغط على المساحات الفارغة يتم التقاطه
       من document لتفجير الفقاعات.
    */
    pointer-events:none;
}


/*
   المحتوى فوق الفقاعات
*/

.topbar,
.ticker,
.wrap{
    position:relative;
    z-index:2;
}


/* =========================================
   الحاوية الرئيسية
========================================= */

.wrap{
    width:100%;
    max-width:900px;
    margin:auto;
}


/* =========================================
   شريط التاريخ
========================================= */

.topbar{
    width:100%;
    max-width:900px;

    margin:auto;

    padding:
        calc(12px + env(safe-area-inset-top))
        18px
        12px;

    text-align:center;

    font-size:clamp(16px,4vw,21px);
    font-weight:800;

    color:var(--accent);

    background:
        linear-gradient(
            180deg,
            rgba(18,21,28,.95),
            rgba(13,16,22,.92)
        );

    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);

    box-shadow:
        0 8px 30px rgba(0,0,0,.25);

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    position:sticky;
    top:0;
    z-index:1000;
}


/* =========================================
   شريط التنبيه
========================================= */

.ticker{
    width:100%;
    max-width:900px;

    margin:14px auto 0;

    overflow:hidden;

    border:1px solid var(--line);
    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            rgba(21,24,31,.92),
            rgba(15,18,24,.92)
        );

    box-shadow:
        0 10px 32px rgba(0,0,0,.25);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
}

.ticker__track{
    min-height:52px;

    display:flex;
    justify-content:center;
    align-items:center;
}

.ticker__text{
    display:block;

    width:100%;

    padding:11px 20px;

    text-align:center;

    font-size:clamp(14px,3.2vw,17px);
    font-weight:700;

    color:#e6ebf3;

    transition:
        opacity .25s ease,
        transform .25s ease;
}


/* =========================================
   الهيدر
========================================= */

header{
    position:relative;

    overflow:hidden;

    margin-top:22px;
    margin-bottom:20px;

    padding:30px 20px;

    text-align:center;

    border:1px solid var(--line);
    border-radius:var(--radius);

    background:
        linear-gradient(
            145deg,
            rgba(20,23,30,.94),
            rgba(12,15,20,.95)
        );

    box-shadow:var(--shadow);
}

header::before{
    content:"";

    position:absolute;

    width:320px;
    height:320px;

    top:-210px;
    right:50%;

    transform:translateX(50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(22,217,245,.16),
            transparent 70%
        );

    pointer-events:none;
}

header::after{
    content:"";

    position:absolute;

    left:20%;
    right:20%;
    bottom:0;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(22,217,245,.45),
            transparent
        );
}

h1{
    position:relative;
    z-index:1;

    margin:0;

    font-size:clamp(27px,6vw,40px);
    font-weight:800;

    letter-spacing:-.4px;

    color:#f7f9fc;

    text-shadow:
        0 3px 18px rgba(0,0,0,.35);
}

.header-subtitle{
    position:relative;
    z-index:1;

    margin:5px 0 0;

    color:var(--muted);

    font-size:14px;
}


/* =========================================
   مكان التحديات
========================================= */

#challenges{
    width:100%;
}


/* =========================================
   بطاقات الأقسام
========================================= */

.card{
    position:relative;

    overflow:hidden;

    margin-top:18px;

    padding:20px 21px;

    border:1px solid var(--line);
    border-radius:var(--radius);

    background:
        linear-gradient(
            145deg,
            rgba(24,27,35,.95),
            rgba(15,18,24,.97)
        );

    box-shadow:
        0 16px 42px rgba(0,0,0,.27),
        inset 0 1px rgba(255,255,255,.035);

    animation:
        cardIn .42s ease both;

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
}

.card:hover{
    transform:translateY(-2px);

    border-color:
        rgba(22,217,245,.20);

    box-shadow:
        0 20px 50px rgba(0,0,0,.33),
        inset 0 1px rgba(255,255,255,.04);
}

.card::before{
    content:"";

    position:absolute;

    top:-70px;
    right:-70px;

    width:180px;
    height:180px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(22,217,245,.09),
            transparent 70%
        );

    pointer-events:none;
}

@keyframes cardIn{

    from{
        opacity:0;
        transform:translateY(12px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* =========================================
   عنوان القسم
========================================= */

.card-title-row{
    position:relative;
    z-index:1;

    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:12px;

    margin-bottom:13px;
}

h2{
    margin:0;

    font-size:clamp(20px,4vw,27px);
    font-weight:800;

    color:var(--accent);

    unicode-bidi:plaintext;
}

.challenge-count{
    flex-shrink:0;

    padding:5px 10px;

    border-radius:999px;

    font-size:12px;
    font-weight:700;

    color:var(--accent);

    background:var(--accent-soft);

    border:
        1px solid rgba(22,217,245,.15);
}


/* =========================================
   قائمة التحديات
========================================= */

ul{
    position:relative;
    z-index:1;

    margin:0;
    padding:0;

    list-style:none;
}

li{
    position:relative;

    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:15px;

    min-height:55px;

    padding:12px 10px;

    border-top:
        1px solid rgba(255,255,255,.065);

    color:var(--text-soft);

    font-size:clamp(16px,3.4vw,20px);

    transition:
        background .18s ease,
        padding .18s ease,
        color .18s ease;
}

li:first-child{
    border-top:none;
}

li:hover{
    background:
        rgba(255,255,255,.025);

    padding-right:15px;

    color:#fff;
}

.challenge-text{
    flex:1;

    min-width:0;

    unicode-bidi:plaintext;
}

.challenge-progress{
    flex-shrink:0;

    min-width:48px;

    padding:3px 8px;

    text-align:center;

    border-radius:999px;

    font-size:13px;
    font-weight:800;

    color:#dffaff;

    background:
        rgba(22,217,245,.08);

    border:
        1px solid rgba(22,217,245,.12);
}


/* =========================================
   بطاقة مدام نزار
========================================= */

.nazar-card{
    position:relative;

    overflow:hidden;

    margin-top:24px;

    padding:20px;

    text-align:center;

    border:
        1px solid var(--line);

    border-radius:
        var(--radius);

    background:
        linear-gradient(
            145deg,
            rgba(24,27,35,.95),
            rgba(15,18,24,.97)
        );

    box-shadow:
        var(--shadow);
}

.nazar-card::before{
    content:"";

    position:absolute;

    width:230px;
    height:230px;

    top:-140px;
    right:-100px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(22,217,245,.08),
            transparent 70%
        );

    pointer-events:none;
}

.nazar-card h2{
    position:relative;
    z-index:1;

    text-align:center;

    margin-bottom:5px;
}

.nazar-card p{
    color:var(--muted);
}

.nazar-card img{
    position:relative;
    z-index:1;

    display:block;

    width:100%;
    max-width:650px;

    margin:15px auto 0;

    border-radius:18px;

    border:
        1px solid var(--line);

    box-shadow:
        0 16px 40px rgba(0,0,0,.38);

    object-fit:cover;
}


/* =========================================
   الفوتر
========================================= */

footer{
    text-align:center;

    margin-top:36px;

    color:var(--muted);

    font-size:14px;
}

footer p{
    margin-bottom:16px;
}

.footer-title{
    color:#ccd3de;
}


/* =========================================
   أزرار التواصل
========================================= */

.social-buttons{
    display:flex;

    justify-content:center;
    align-items:center;

    flex-wrap:wrap;

    gap:10px;
}

.join-btn{
    display:inline-flex;

    justify-content:center;
    align-items:center;

    min-width:130px;

    padding:11px 18px;

    border-radius:14px;

    text-decoration:none;

    font-size:15px;
    font-weight:800;

    color:#061014;

    background:
        linear-gradient(
            135deg,
            #20dff7,
            #0cbcd5
        );

    box-shadow:
        0 10px 25px rgba(22,217,245,.14);

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        filter .18s ease;
}

.join-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 14px 32px rgba(22,217,245,.22);

    filter:brightness(1.05);
}

.join-btn:active{
    transform:scale(.97);
}


/* =========================================
   شاشة التحميل
========================================= */

.loading{
    padding:35px 20px;

    text-align:center;

    color:var(--muted);

    font-weight:700;
}

.error-message{
    padding:25px;

    border:
        1px solid rgba(255,69,103,.15);

    border-radius:18px;

    background:
        rgba(255,69,103,.055);

    color:#ff90a3;

    text-align:center;
}


/* =========================================
   تحسين الجوال
========================================= */

@media (max-width:600px){

    body{
        padding-left:10px;
        padding-right:10px;
    }

    .topbar{
        padding-left:8px;
        padding-right:8px;
    }

    .ticker{
        border-radius:17px;
    }

    header{
        margin-top:17px;

        padding:24px 14px;

        border-radius:20px;
    }

    .card{
        padding:17px 14px;

        border-radius:20px;
    }

    .card-title-row{
        align-items:flex-start;
    }

    .challenge-count{
        margin-top:3px;
    }

    li{
        gap:10px;

        min-height:51px;

        padding-top:10px;
        padding-bottom:10px;
    }

    .challenge-progress{
        min-width:44px;

        font-size:12px;
    }

    .nazar-card{
        padding:15px;

        border-radius:20px;
    }

    .nazar-card img{
        border-radius:15px;
    }

    .join-btn{
        min-width:120px;
    }

}


/* =========================================
   الأجهزة الصغيرة جدًا
========================================= */

@media (max-width:380px){

    .card-title-row{
        gap:7px;
    }

    h2{
        font-size:19px;
    }

    li{
        font-size:15px;
    }

    .challenge-count{
        font-size:11px;
    }

}


/* =========================================
   تقليل الحركة لمن يطلب ذلك
========================================= */

@media (prefers-reduced-motion:reduce){

    .card{
        animation:none;
    }

    .ticker__text,
    .card,
    .join-btn,
    li{
        transition:none;
    }

}

</style>
</head>


<body>

<!-- =====================================
     خلفية الفقاعات
====================================== -->

<canvas
    id="bubbleCanvas"
    aria-hidden="true"
></canvas>


<div
    class="topbar"
    id="topdate"
>
    📅 جاري تحميل آخر تحديث...
</div>


<div
    class="ticker"

>
    <div class="ticker__track">

        <span
            class="ticker__text"
            id="tickerText"
        >

        </span>

    </div>
</div>


<div class="wrap">

    <header>

        <h1>
            التحديات اليومية ريد ديد
        </h1>

        <p class="header-subtitle">
            Red Dead Online Daily Challenges
        </p>

    </header>

        id="challenges"

    >

<script>

/* =========================================
   منع النسخ والزر الأيمن والسحب
========================================= */

document.addEventListener(
    "contextmenu",
    function(e){
        e.preventDefault();
    }
);


document.addEventListener(
    "copy",
    function(e){
        e.preventDefault();
    }
);


document.addEventListener(
    "cut",
    function(e){
        e.preventDefault();
    }
);


document.addEventListener(
    "paste",
    function(e){
        e.preventDefault();
    }
);


document.addEventListener(
    "dragstart",
    function(e){
        e.preventDefault();
    }
);


/* =========================================
   منع الاختصارات الشائعة
========================================= */

document.addEventListener(
    "keydown",
    function(e){

        const key =
            e.key.toUpperCase();

        const blockedCtrlKeys =
            [
                "U",
                "S",
                "A",
                "C",
                "X",
                "V"
            ];

        const blockedDevToolsKeys =
            [
                "I",
                "J",
                "C"
            ];


        const isF12 =
            e.key === "F12";


        const isDevToolsShortcut =
            e.ctrlKey &&
            e.shiftKey &&
            blockedDevToolsKeys.includes(key);


        const isCtrlShortcut =
            e.ctrlKey &&
            blockedCtrlKeys.includes(key);


        if(
            isF12 ||
            isDevToolsShortcut ||
            isCtrlShortcut
        ){

            e.preventDefault();

            alert(
                "🚫 لا يمكن نسخ محتوى هذه الصفحة"
            );

        }

    }
);


/* =========================================
   تنظيف النص
========================================= */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================
   التنبيه العلوي
========================================= */

let tickerLines = [];

let tickerIndex = 0;

let tickerTimer = null;


function showNextLine(){

    if(!tickerLines.length){
        return;
    }


    const tickerText =
        document.getElementById(
            "tickerText"
        );


    tickerText.style.opacity =
        "0";


    tickerText.style.transform =
        "translateY(5px)";


    setTimeout(
        function(){

            tickerText.textContent =
                tickerLines[tickerIndex];


            tickerIndex =
                (tickerIndex + 1) %
                tickerLines.length;


            tickerText.style.opacity =
                "1";


            tickerText.style.transform =
                "translateY(0)";

        },
        220
    );

}


fetch(
    "ticker.txt?v=" +
    Date.now(),
    {
        cache:"no-store"
    }
)

.then(function(response){

    if(!response.ok){

        throw new Error(
            "Ticker request failed"
        );

    }

    return response.text();

})

.then(function(text){

    tickerLines =
        text
        .split(/\r?\n/)
        .map(function(line){

            return line.trim();

        })
        .filter(Boolean);


    if(!tickerLines.length){

        document
        .getElementById("ticker")
        .style.display =
            "none";

        return;
    }


    showNextLine();


    if(tickerTimer){

        clearInterval(
            tickerTimer
        );

    }


    tickerTimer =
        setInterval(
            showNextLine,
            5000
        );

})

.catch(function(){

    document
    .getElementById("ticker")
    .style.display =
        "none";

});


/* =========================================
   استخراج التقدم
========================================= */

function parseChallengeLine(line){

    const match =
        line.match(
            /^(\d+\s*\/\s*\d+)\s*(.*)$/
        );


    if(match){

        return {

            progress:
                match[1]
                .replace(/\s+/g,""),

            text:
                match[2].trim()

        };

    }


    return {

        progress:"",

        text:line.trim()

    };

}


/* =========================================
   هل السطر تحدي؟
========================================= */

function isChallengeLine(line){

    return /^\d+\s*\/\s*\d+/.test(
        line.trim()
    );

}


/* =========================================
   إنشاء بطاقة
========================================= */

function createSectionHTML(
    title,
    challenges
){

    const safeTitle =
        escapeHTML(title);


    let itemsHTML = "";


    challenges.forEach(
        function(line){

            const challenge =
                parseChallengeLine(line);


            const safeText =
                escapeHTML(
                    challenge.text
                );


            const safeProgress =
                escapeHTML(
                    challenge.progress
                );


            itemsHTML += `
                <li>

                    <span class="challenge-text">
                        ${safeText}
                    </span>

                    ${
                        safeProgress
                        ?
                        `
                        <span class="challenge-progress">
                            ${safeProgress}
                        </span>
                        `
                        :
                        ""
                    }

                </li>
            `;

        }
    );


    return `
        <div class="card">

            <div class="card-title-row">

                <h2>
                    ${safeTitle}
                </h2>

                <span class="challenge-count">
                    ${challenges.length}
                    تحديات
                </span>

            </div>

            <ul>
                ${itemsHTML}
            </ul>

        </div>
    `;

}


/* =========================================
   التحديات اليومية
========================================= */

fetch(
    "font-size.txt?v=" +
    Date.now(),
    {
        cache:"no-store"
    }
)

.then(function(response){

    if(!response.ok){

        throw new Error(
            "Challenges request failed"
        );

    }

    return response.text();

})

.then(function(text){

    const lines =
        text
        .split(/\r?\n/);


    while(
        lines.length &&
        !lines[0].trim()
    ){

        lines.shift();

    }


    if(!lines.length){

        throw new Error(
            "Empty challenges file"
        );

    }


    const firstLine =
        lines.shift().trim();


    document
    .getElementById(
        "topdate"
    )
    .innerHTML =
        `📅 <b>تاريخ التحديث:</b> ${escapeHTML(firstLine)}`;


    const sections = [];

    let currentSection =
        null;


    lines.forEach(
        function(rawLine){

            const line =
                rawLine.trim();


            if(!line){
                return;
            }


            if(
                isChallengeLine(line)
            ){

                if(!currentSection){

                    currentSection = {

                        title:
                            "التحديات اليومية",

                        challenges:[]
                    };


                    sections.push(
                        currentSection
                    );

                }


                currentSection
                .challenges
                .push(line);

            }

            else{

                currentSection = {

                    title:line,

                    challenges:[]
                };


                sections.push(
                    currentSection
                );

            }

        }
    );


    const validSections =
        sections.filter(
            function(section){

                return (
                    section.title ||
                    section
                    .challenges
                    .length
                );

            }
        );


    let html = "";


    validSections.forEach(
        function(section){

            html +=
                createSectionHTML(
                    section.title,
                    section.challenges
                );

        }
    );


    if(!html.trim()){

        throw new Error(
            "No challenges found"
        );

    }


    const container =
        document.getElementById(
            "challenges"
        );


    container.classList.remove(
        "loading"
    );


    container.innerHTML =
        html;

})

.catch(function(error){

    console.error(
        error
    );


    const container =
        document.getElementById(
            "challenges"
        );


    container.classList.remove(
        "loading"
    );


    container.innerHTML = `
        <div class="error-message">
            ❌ حدث خطأ أثناء تحميل التحديات.
        </div>
    `;

});

/* ==========================================================
   ==========================================================
               نظام فقاعات TX66W
   ==========================================================
========================================================== */

(function(){

"use strict";


/* =========================================
   Canvas
========================================= */

const canvas =
    document.getElementById(
        "bubbleCanvas"
    );


const ctx =
    canvas.getContext(
        "2d",
        {
            alpha:true
        }
    );


/* =========================================
   إعدادات الفقاعات
========================================= */

const BUBBLE_CONFIG = {

    text:"tx66w",

    /*
       العدد أقل على الجوال
       للحفاظ على سلاسة الموقع
    */

    mobileCount:14,
    desktopCount:22,

    minRadius:24,
    maxRadius:68,

    speedMin:12,
    speedMax:40,

    particleCount:18,

    maxDPR:1.6

};


/* =========================================
   الألوان
========================================= */

const BUBBLE_COLORS = [

    "#00EFFF",
    "#00FF88",
    "#FFE600",
    "#FF375F",
    "#FF00C8",
    "#A855F7",
    "#3B82F6",
    "#FF7A00",
    "#FFFFFF",
    "#00FFD5"

];


/* =========================================
   متغيرات
========================================= */

let width = 0;
let height = 0;
let dpr = 1;

let bubbles = [];
let particles = [];

let lastFrame =
    performance.now();


/* =========================================
   أدوات
========================================= */

function rand(min,max){

    return (
        Math.random() *
        (max-min)
    ) + min;

}


function randomColor(){

    return BUBBLE_COLORS[
        Math.floor(
            Math.random() *
            BUBBLE_COLORS.length
        )
    ];

}


function clampBubble(
    value,
    min,
    max
){

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}


function hexRGB(hex){

    const value =
        hex.replace(
            "#",
            ""
        );


    return {

        r:
            parseInt(
                value.slice(0,2),
                16
            ),

        g:
            parseInt(
                value.slice(2,4),
                16
            ),

        b:
            parseInt(
                value.slice(4,6),
                16
            )

    };

}


/* =========================================
   تحويل الألوان مرة واحدة
========================================= */

const bubbleColorData =
    BUBBLE_COLORS.map(
        function(color){

            return {

                hex:color,

                rgb:
                    hexRGB(color)

            };

        }
    );


function pickBubbleColor(){

    return bubbleColorData[
        Math.floor(
            Math.random() *
            bubbleColorData.length
        )
    ];

}


/* =========================================
   Bubble
========================================= */

class Bubble{

    constructor(initial){

        this.reset(
            initial
        );

    }


    reset(initial){

        /*
           depth:
           0 = بعيد
           1 = قريب
        */

        this.depth =
            Math.pow(
                Math.random(),
                .8
            );


        /*
           الحجم حسب العمق
        */

        this.radius =
            BUBBLE_CONFIG.minRadius +
            (
                BUBBLE_CONFIG.maxRadius -
                BUBBLE_CONFIG.minRadius
            ) *
            this.depth;


        this.radius *=
            rand(
                .88,
                1.08
            );


        /*
           السرعة حسب العمق
        */

        this.speed =
            BUBBLE_CONFIG.speedMin +
            (
                BUBBLE_CONFIG.speedMax -
                BUBBLE_CONFIG.speedMin
            ) *
            this.depth;


        this.speed *=
            rand(
                .85,
                1.15
            );


        /*
           Y
        */

        this.y =
            rand(
                this.radius,
                Math.max(
                    this.radius,
                    height-this.radius
                )
            );


        /*
           X

           الحركة:
           اليسار -> اليمين
        */

        if(initial){

            this.x =
                rand(
                    -this.radius,
                    width+this.radius
                );

        }

        else{

            this.x =
                -this.radius -
                rand(
                    30,
                    180
                );

        }


        /*
           اللون
        */

        this.color =
            pickBubbleColor();


        /*
           حركة الطفو
        */

        this.phase =
            rand(
                0,
                Math.PI*2
            );


        this.floatSpeed =
            rand(
                .35,
                .85
            );


        this.floatAmount =
            rand(
                2,
                8
            );


        this.drawY =
            this.y;


        /*
           الشفافية
        */

        this.alpha =
            .28 +
            this.depth*.48;


        /*
           النص
        */

        this.fontSize =
            Math.max(
                11,
                this.radius*.34
            );

    }


    update(
        dt,
        time
    ){

        this.x +=
            this.speed *
            dt;


        this.drawY =
            this.y +
            Math.sin(
                time *
                this.floatSpeed +
                this.phase
            ) *
            this.floatAmount;


        /*
           إذا خرجت يمين الشاشة
        */

        if(
            this.x -
            this.radius >
            width + 80
        ){

            this.reset(
                false
            );

        }

    }


    draw(){

        const x =
            Math.round(
                this.x*2
            )/2;


        const y =
            Math.round(
                this.drawY*2
            )/2;


        const radius =
            this.radius;


        const rgb =
            this.color.rgb;


        ctx.save();


        /*
           جسم الفقاعة
        */

        ctx.globalAlpha =
            this.alpha;


        ctx.beginPath();


        ctx.arc(
            x,
            y,
            radius,
            0,
            Math.PI*2
        );


        ctx.fillStyle =
            `rgba(
                ${rgb.r},
                ${rgb.g},
                ${rgb.b},
                .09
            )`;


        ctx.fill();


        /*
           إطار الفقاعة
        */

        ctx.globalAlpha =
            .68;


        ctx.lineWidth =
            Math.max(
                1,
                radius*.02
            );


        ctx.strokeStyle =
            `rgba(
                ${rgb.r},
                ${rgb.g},
                ${rgb.b},
                .78
            )`;


        ctx.stroke();


        /*
           اللمعة العلوية
        */

        ctx.beginPath();


        ctx.arc(

            x-radius*.21,

            y-radius*.22,

            radius*.59,

            Math.PI*1.08,

            Math.PI*1.48

        );


        ctx.lineWidth =
            Math.max(
                1.4,
                radius*.03
            );


        ctx.lineCap =
            "round";


        ctx.strokeStyle =
            "rgba(255,255,255,.48)";


        ctx.stroke();


        /*
           نقطة انعكاس
        */

        ctx.beginPath();


        ctx.arc(

            x-radius*.31,

            y-radius*.34,

            radius*.065,

            0,

            Math.PI*2

        );


        ctx.fillStyle =
            "rgba(255,255,255,.58)";


        ctx.fill();


        /*
           tx66w
        */

        ctx.globalAlpha =
            .90;


        ctx.font =
            `800 ${this.fontSize}px Arial,sans-serif`;


        ctx.textAlign =
            "center";


        ctx.textBaseline =
            "middle";


        /*
           ظل النص بدون blur
           للحفاظ على الأداء
        */

        ctx.fillStyle =
            "rgba(0,0,0,.75)";


        ctx.fillText(
            BUBBLE_CONFIG.text,
            x+1,
            y+1
        );


        ctx.fillStyle =
            "#ffffff";


        ctx.fillText(
            BUBBLE_CONFIG.text,
            x,
            y
        );


        ctx.restore();

    }


    contains(
        x,
        y
    ){

        const dx =
            x-this.x;


        const dy =
            y-this.drawY;


        const radius =
            this.radius*1.12;


        return (
            dx*dx +
            dy*dy
        ) <= (
            radius*radius
        );

    }


    explode(){

        createBubbleExplosion(

            this.x,

            this.drawY,

            this.radius,

            this.color

        );


        this.reset(
            false
        );

    }

}


/* =========================================
   جزيئات الانفجار
========================================= */

class BubbleParticle{

    constructor(
        x,
        y,
        radius,
        color
    ){

        this.x=x;
        this.y=y;


        const angle =
            rand(
                0,
                Math.PI*2
            );


        const force =
            rand(
                60,
                180
            ) *
            clampBubble(
                radius/45,
                .7,
                1.3
            );


        this.vx =
            Math.cos(angle) *
            force;


        this.vy =
            Math.sin(angle) *
            force;


        this.size =
            rand(
                1.5,
                4
            );


        this.color =
            color;


        this.life =
            rand(
                .28,
                .55
            );


        this.maxLife =
            this.life;


        this.gravity =
            45;

    }


    update(dt){

        this.life -=
            dt;


        this.x +=
            this.vx*dt;


        this.y +=
            this.vy*dt;


        this.vx *=
            .982;


        this.vy *=
            .982;


        this.vy +=
            this.gravity*dt;

    }


    draw(){

        const alpha =
            clampBubble(
                this.life /
                this.maxLife,
                0,
                1
            );


        const rgb =
            this.color.rgb;


        ctx.globalAlpha =
            alpha;


        ctx.beginPath();


        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI*2
        );


        ctx.fillStyle =
            `rgb(
                ${rgb.r},
                ${rgb.g},
                ${rgb.b}
            )`;


        ctx.fill();

    }

}


/* =========================================
   موجة الانفجار
========================================= */

class BubbleShockwave{

    constructor(
        x,
        y,
        radius,
        color
    ){

        this.x=x;
        this.y=y;


        this.radius =
            radius*.3;


        this.speed =
            radius*4;


        this.color =
            color;


        this.life =
            .22;


        this.maxLife =
            .22;

    }


    update(dt){

        this.life -=
            dt;


        this.radius +=
            this.speed*dt;

    }


    draw(){

        const alpha =
            clampBubble(
                this.life /
                this.maxLife,
                0,
                1
            );


        const rgb =
            this.color.rgb;


        ctx.globalAlpha =
            alpha*.75;


        ctx.beginPath();


        ctx.arc(
            this.x,
            this.y,
            this.radius,
            0,
            Math.PI*2
        );


        ctx.lineWidth =
            2;


        ctx.strokeStyle =
            `rgb(
                ${rgb.r},
                ${rgb.g},
                ${rgb.b}
            )`;


        ctx.stroke();

    }

}


/* =========================================
   إنشاء الانفجار
========================================= */

function createBubbleExplosion(
    x,
    y,
    radius,
    color
){

    const amount =
        Math.round(

            BUBBLE_CONFIG
            .particleCount *

            clampBubble(
                radius/45,
                .75,
                1.25
            )

        );


    for(
        let i=0;
        i<amount;
        i++
    ){

        particles.push(

            new BubbleParticle(
                x,
                y,
                radius,
                color
            )

        );

    }


    particles.push(

        new BubbleShockwave(
            x,
            y,
            radius,
            color
        )

    );

}


/* =========================================
   Resize
========================================= */

function resizeBubbleCanvas(){

    dpr =
        Math.min(

            window.devicePixelRatio ||
            1,

            BUBBLE_CONFIG.maxDPR

        );


    width =
        window.innerWidth;


    height =
        window.innerHeight;


    canvas.width =
        Math.round(
            width*dpr
        );


    canvas.height =
        Math.round(
            height*dpr
        );


    canvas.style.width =
        width+"px";


    canvas.style.height =
        height+"px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    ctx.imageSmoothingEnabled =
        true;


    createBubbles();

}


/* =========================================
   إنشاء الفقاعات
========================================= */

function createBubbles(){

    bubbles=[];
    particles=[];


    const count =
        width < 700
        ?
        BUBBLE_CONFIG.mobileCount
        :
        BUBBLE_CONFIG.desktopCount;


    for(
        let i=0;
        i<count;
        i++
    ){

        bubbles.push(
            new Bubble(true)
        );

    }


    /*
       البعيدة خلف القريبة
    */

    bubbles.sort(
        function(a,b){

            return (
                a.depth -
                b.depth
            );

        }
    );

}


/* =========================================
   تفجير الفقاعة عند اللمس
========================================= */

function popBubbleAt(
    x,
    y
){

    /*
       نبحث من القريب إلى البعيد
    */

    for(
        let i=
            bubbles.length-1;
        i>=0;
        i--
    ){

        if(
            bubbles[i]
            .contains(
                x,
                y
            )
        ){

            bubbles[i]
            .explode();


            return true;

        }

    }


    return false;

}


/* =========================================
   التقاط اللمس / الماوس

   نسمح للأزرار والروابط بالعمل.
========================================= */

document.addEventListener(
    "pointerdown",
    function(event){

        /*
           إذا ضغط المستخدم على رابط أو زر
           لا نتدخل.
        */

        if(
            event.target.closest(
                "a,button,input,textarea,select"
            )
        ){

            return;

        }


        popBubbleAt(
            event.clientX,
            event.clientY
        );

    },
    {
        passive:true
    }
);


/* =========================================
   رسم الفقاعات
========================================= */

function animateBubbles(now){

    const dt =
        Math.min(
            (now-lastFrame)/1000,
            .033
        );


    lastFrame =
        now;


    const time =
        now/1000;


    /*
       Canvas شفاف:
       نمسح فقط ولا نرسم خلفية.
       خلفية الموقع الأصلية تبقى ظاهرة.
    */

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
       الفقاعات
    */

    for(
        let i=0;
        i<bubbles.length;
        i++
    ){

        bubbles[i]
        .update(
            dt,
            time
        );


        bubbles[i]
        .draw();

    }


    /*
       الانفجارات
    */

    for(
        let i=
            particles.length-1;
        i>=0;
        i--
    ){

        const particle =
            particles[i];


        particle.update(
            dt
        );


        particle.draw();


        if(
            particle.life<=0
        ){

            particles.splice(
                i,
                1
            );

        }

    }


    ctx.globalAlpha =
        1;


    requestAnimationFrame(
        animateBubbles
    );

}


/* =========================================
   عند الرجوع للتبويب
========================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        lastFrame =
            performance.now();

    }
);


/* =========================================
   تشغيل الفقاعات
========================================= */

window.addEventListener(
    "resize",
    resizeBubbleCanvas
);


resizeBubbleCanvas();


requestAnimationFrame(
    animateBubbles
);

})();

</script>
